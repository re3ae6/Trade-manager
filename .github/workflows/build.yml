name: Build Trade Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build web assets
        run: npm run build

      - name: Verify web build
        run: |
          test -f www/index.html
          test -f www/manifest.json
          test -f www/service-worker.js
          test -f www/icons/icon-192.png
          test -f www/icons/icon-512.png
          echo "Web build verified successfully."

      - name: Add Android platform
        run: npx cap add android

      - name: Prepare app icon source
        run: |
          mkdir -p assets
          cp icons/icon-512.png assets/icon.png

      - name: Generate app icon
        run: npx capacitor-assets generate --android

      - name: Sync web assets and plugins into Android project
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TradeManager-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
