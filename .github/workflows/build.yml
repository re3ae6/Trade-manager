name: Build Trade Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html manifest.json service-worker.js www/ 2>/dev/null || true
          cp icon-*.png www/ 2>/dev/null || true

      - name: Add Android platform
        run: npx cap add android

      - name: Prepare app icon source
        run: |
          mkdir -p assets
          cp icon-512.png assets/icon.png

      - name: Generate app icon
        run: npx capacitor-assets generate --android

      - name: Sync web assets into Android project
        run: npx cap copy android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TradeManager-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
