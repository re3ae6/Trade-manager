name: Build Trade Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json found — using npm ci for a reproducible install."
            npm ci
          else
            echo "No package-lock.json yet — using npm install. Commit the generated lockfile to switch to npm ci."
            npm install
          fi

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build web assets
        run: npm run build

      - name: Verify web build
        run: |
          test -f www/index.html
          test -f www/manifest.json
          test -f www/service-worker.js
          test -f www/icons/icon-192.png
          test -f www/icons/icon-512.png
          echo "Web build verified successfully."

      - name: Add Android platform
        run: npx cap add android

      - name: Remove INTERNET permission (offline-only app)
        run: |
          sed -i '/android.permission.INTERNET/d' android/app/src/main/AndroidManifest.xml
          echo "AndroidManifest.xml after removal:"
          cat android/app/src/main/AndroidManifest.xml

      - name: Prepare app icon source
        run: |
          mkdir -p assets
          cp icons/icon-512.png assets/icon.png

      - name: Generate app icon
        run: npx capacitor-assets generate --android

      - name: Sync web assets and plugins into Android project
        run: npx cap sync android

      - name: Re-assert INTERNET permission removal after sync
        run: |
          # `cap sync` can re-merge manifest entries from plugins, so the
          # permission is stripped again here, right before the Gradle build.
          sed -i '/android.permission.INTERNET/d' android/app/src/main/AndroidManifest.xml

      - name: Verify INTERNET permission is absent
        run: |
          if grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            echo "::error::android.permission.INTERNET is present in AndroidManifest.xml. This app must remain offline-only (see project spec, section 23)."
            exit 1
          fi
          echo "Confirmed: no INTERNET permission in AndroidManifest.xml."

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: TradeManager-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
